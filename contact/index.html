<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Ye Teng.">
  <title>Contact | Ye Teng</title>
  <link rel="stylesheet" href="../style.css">
  <script type="module" src="../global.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">Get in touch</p>
    <h1>Contact</h1>
    <p>
      Email me directly at <a href="mailto:yeteng@ucsd.edu">yeteng@ucsd.edu</a>,
      or use this form to open a prefilled message in your default email application.
    </p>

    <form action="mailto:yeteng@ucsd.edu">
      <label>
        Subject
        <input name="subject" value="Hello from your portfolio" required>
      </label>

      <label>
        Message
        <textarea name="body" required>I would like to connect with you.</textarea>
      </label>

      <button>Send message</button>
    </form>
  </main>
</body>
</html>
